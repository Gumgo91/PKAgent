[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pkagent"
version = "2.0.0.dev0"
description = "An LLM agent that develops population pharmacokinetic and pharmacodynamic models with the PKPy2 estimation engine."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Hyunseung Kong" }, { name = "Inyoung Kim" }]
keywords = [
  "population pharmacokinetics",
  "PopPK",
  "PK/PD",
  "nonlinear mixed effects",
  "large language model",
  "agent",
  "tool calling",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pkpy2>=0.2.1",
  "numpy>=2.2,<3",
  "scipy>=1.16,<2",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "openai>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pkagent = "pkagent.cli:main"

[project.urls]
Repository = "https://github.com/Gumgo91/PKAgent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
